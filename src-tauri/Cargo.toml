[package]
name = "brainstory"
version = "0.1.0"
description = "Brainstory - think out loud, locally"
license = "GPL-3.0-only"
repository = "https://github.com/brainstory/desktop-app"
edition = "2021"
rust-version = "1.82"

[lib]
name = "brainstory_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

# storage
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
sha2 = "0.11"

# model downloads + external endpoint clients
reqwest = { version = "0.13", default-features = false, features = [
	"rustls",
	"stream",
	"json",
	"multipart",
] }
futures-util = "0.3"
tokio = { version = "1", features = ["rt", "fs", "io-util", "sync", "time", "macros"] }

# local inference.
# Pinned exactly on purpose: the crates vendor their own llama.cpp /
# whisper.cpp / ggml C++, and the binary's force_exit() workaround depends
# on that C++'s teardown behavior. Let a deliberate upgrade change it.
llama-cpp-2 = "=0.1.156"
hound = "3"

thiserror = "2"
encoding_rs = "0.8"
libc = "0.2"
cpal = "0.18"
# secrets (HF token, external endpoint API keys) in the OS keychain
keyring = "4"

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "=0.16.0", features = ["metal"] }
objc2-app-kit = "0.3"
objc2 = "0.6"

[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = "=0.16.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
