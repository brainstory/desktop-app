[package]
name = "brainstory"
version = "0.6.1"
description = "Brainstory - think out loud, locally"
license = "GPL-3.0-only"
repository = "https://github.com/brainstory/desktop-app"
edition = "2021"
rust-version = "1.82"

[lib]
name = "brainstory_lib"
# Desktop-only app: rlib is all the binary and integration tests need
# (staticlib/cdylib exist for the mobile targets this app does not ship).
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

# storage
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
sha2 = "0.11"

# model downloads + external endpoint clients
reqwest = { version = "0.13", default-features = false, features = [
	"rustls",
	"stream",
	"json",
	"multipart",
] }
futures-util = "0.3"
tokio = { version = "1", features = ["rt", "fs", "io-util", "sync", "time", "macros"] }

# local inference.
# Pinned exactly on purpose: the crates vendor their own llama.cpp /
# whisper.cpp / ggml C++, and the binary's force_exit() workaround depends
# on that C++'s teardown behavior. Let a deliberate upgrade change it.
llama-cpp-2 = "=0.1.158"
# The C++ actually lives in the -sys crate, which llama-cpp-2 only asks
# for as ^0.1.x - pin it too, or a lockfile-only update can swap the
# vendored llama.cpp/ggml underneath the pin above. Keep it equal to
# llama-cpp-2's version.
llama-cpp-sys-2 = "=0.1.158"
hound = "3"

encoding_rs = "0.8"
libc = "0.2"
cpal = "0.18"
# secrets (HF token, external endpoint API keys) in the OS keychain
keyring = "4"
fs4 = "1.1.0"
dirs = "7.0.0"
# physical core count for whisper's thread pool (std only reports logical)
num_cpus = "1"
chrono-tz = "0.10.4"

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "=0.16.0", features = ["metal"] }
# whisper.cpp's C++ lives here; whisper-rs only asks for ^0.15 (see the
# llama-cpp-sys-2 note above)
whisper-rs-sys = "=0.15.0"
objc2-app-kit = "0.3"
objc2 = "0.6"
# Pinned exactly: the crate ships a Swift bridge compiled by its build.rs;
# a deliberate upgrade should re-verify the analyzer surface (see
# tests/apple_stt_smoke.rs). Requires Xcode with the macOS 26 SDK for the
# SpeechAnalyzer family; older SDKs compile those paths as stubs.
speech = "=0.9.0"

[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = "=0.16.0"
whisper-rs-sys = "=0.15.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[dev-dependencies]
tempfile = "3.27.0"

# whisper-rs is vendored so whisper.cpp builds against llama-cpp-sys-2's
# ggml instead of bundling a second, incompatible copy (see
# vendor/VENDORED.md). The versions match the pins above.
# glib-macros and gtk3-macros are vendored to drop the unmaintained
# proc-macro-error (RUSTSEC-2024-0370); the 0.18 series never got upstream's
# fix (see vendor/VENDORED.md).
[patch.crates-io]
whisper-rs = { path = "vendor/whisper-rs" }
whisper-rs-sys = { path = "vendor/whisper-rs-sys" }
glib-macros = { path = "vendor/glib-macros" }
gtk3-macros = { path = "vendor/gtk3-macros" }
