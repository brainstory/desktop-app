# llama.cpp / whisper.cpp require C++ filesystem APIs from macOS 10.15+;
# we target 12+ for Metal + WKWebView media capture. Cargo only supports the
# [env] table at the top level (not per-target), which is fine since this
# project only builds natively on macOS.
[env]
MACOSX_DEPLOYMENT_TARGET = "12.0"
