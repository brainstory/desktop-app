# llama.cpp / whisper.cpp require C++ filesystem APIs from macOS 10.15+;
# we target 12+ for Metal + WKWebView media capture. Cargo only supports the
# [env] table at the top level (not per-target), which is fine since this
# project only builds natively on macOS.
# force = true is required: the tauri CLI injects MACOSX_DEPLOYMENT_TARGET=10.13
# when unset, and non-forced [env] values only apply when the var is unset.
[env]
MACOSX_DEPLOYMENT_TARGET = { value = "12.0", force = true }

# whisper.cpp now builds against llama-cpp-sys-2's ggml (vendor/VENDORED.md),
# so the program contains one ggml and links without duplicate symbols on
# macOS. These tolerance flags date from when each engine bundled its own
# copy (MSVC link/lld-link and Linux ld hard-error duplicates); they stay as
# a safety net until the Windows and Linux CI builds confirm the duplicates
# are gone there too, then they can be removed. The repo-root
# .cargo/config.toml mirrors this section for tauri CLI invocations from the
# repo root.
[target.x86_64-pc-windows-msvc]
rustflags = [
    "-C", "link-arg=/FORCE:MULTIPLE",
    # local cross-compiles only: satisfies the stray ggml-blas.lib directive
    # (see windows-xwin-stub/README.md)
    "-L", "native=windows-xwin-stub",
]

# Linux counterpart of /FORCE:MULTIPLE (see above): kept as a safety net.
[target.'cfg(all(unix, not(target_os = "macos")))']
rustflags = ["-C", "link-arg=-Wl,--allow-multiple-definition"]
