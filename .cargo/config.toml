# Read by cargo when the tauri CLI invokes it (from this root dir).
# src-tauri/.cargo/config.toml only applies to direct cargo runs in src-tauri.

[target.x86_64-pc-windows-msvc]
# Safety net from when llama.cpp and whisper.cpp each bundled ggml (duplicate
# symbols); whisper.cpp now uses llama's ggml - see
# src-tauri/.cargo/config.toml.
# -L stub: whisper-rs-sys 0.15 cross-compile quirk (see
# src-tauri/windows-xwin-stub/README.md).
rustflags = [
    "-C", "link-arg=/FORCE:MULTIPLE",
    "-L", "native=src-tauri/windows-xwin-stub",
]

[env]
MACOSX_DEPLOYMENT_TARGET = { value = "12.0", force = true }

# Linux counterpart of /FORCE:MULTIPLE (see above): kept as a safety net.
[target.'cfg(all(unix, not(target_os = "macos")))']
rustflags = ["-C", "link-arg=-Wl,--allow-multiple-definition"]
