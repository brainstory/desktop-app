name: Nightly build

# Builds all three platforms on every push to main, and can be triggered
# manually from any branch (gh workflow run nightly.yml --ref <branch>) to
# test platform builds without local cross-compilation.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Nightly (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            # macos-26: needs the Xcode 26 SDK so the Apple Speech engine's
            # Swift bridge is real, not stubbed (enforced by build.rs)
            os: macos-26
            bundles: app
          - name: windows
            os: windows-latest
            bundles: nsis
          - name: linux
            os: ubuntu-latest
            bundles: deb rpm appimage
    runs-on: ${{ matrix.os }}
    # release build + bundling + the engine smoke test (a debug build of
    # the test crate) on a cold cache; still well below the 6h default
    timeout-minutes: 120
    env:
      REQUIRE_MACOS26_SDK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm version: the packageManager field in package.json (a
      # `version:` input here too makes the action fail on mismatch)
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch (this action publishes no version tags)
        with:
          # same exact version as rust-toolchain.toml (which rustup honours
          # for every cargo call below); keep the two in sync
          toolchain: "1.98.1"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev cmake

      - name: Stamp nightly version
        shell: bash
        run: |
          BASE="$(node -e "console.log(JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json','utf8')).version)")"
          NIGHTLY="${BASE}-nightly.sha${GITHUB_SHA::7}"
          echo "stamping nightly version $NIGHTLY"
          VERSION="$NIGHTLY" node -e "
            const fs = require('fs');
            const p = 'src-tauri/tauri.conf.json';
            const j = JSON.parse(fs.readFileSync(p, 'utf8'));
            j.version = process.env.VERSION;
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
          "

      # Nightly artifacts are never published to the update feed, so they
      # are not signed at all: src-tauri/tauri.nightly.conf.json turns off
      # updater artifacts. A file, not inline JSON, because pwsh (the
      # Windows default shell) can strip the quotes from a JSON argument.
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: pnpm tauri build --bundles app --config src-tauri/tauri.nightly.conf.json

      - name: Package DMG (macOS)
        if: runner.os == 'macOS'
        run: bash scripts/make-dmg.sh

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: pnpm tauri build --bundles nsis --config src-tauri/tauri.nightly.conf.json

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: pnpm tauri build --bundles ${{ matrix.bundles }} --config src-tauri/tauri.nightly.conf.json

      # The engine smoke test is the only guard that whisper.cpp and
      # llama.cpp actually RUN together in one process (the duplicate
      # ggml symbol tolerance). It needs real model files, so it runs
      # here with tiny ones, cached across runs.
      - name: Restore tiny test models
        id: engine-models
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/engine-models
          key: engine-models-tiny-v1

      - name: Download tiny test models
        if: steps.engine-models.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/engine-models"
          curl -fL --retry 3 -o "${RUNNER_TEMP}/engine-models/whisper-tiny.en.bin" \
            "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin"
          # stories260K: a ~1MB llama used by upstream llama.cpp tests
          curl -fL --retry 3 -o "${RUNNER_TEMP}/engine-models/tiny.gguf" \
            "https://huggingface.co/ggml-org/models/resolve/main/tinyllamas/stories260K.gguf"

      - name: Engine smoke test (whisper + llama coexist)
        shell: bash
        working-directory: src-tauri
        env:
          WHISPER_MODEL_PATH: ${{ runner.temp }}/engine-models/whisper-tiny.en.bin
          LLM_MODEL_PATH: ${{ runner.temp }}/engine-models/tiny.gguf
        run: cargo test --test engine_smoke --locked

      - name: Upload artifacts (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-macos
          path: src-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 7
          if-no-files-found: error

      - name: Upload artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 7
          if-no-files-found: error

      - name: Upload artifacts (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 7
          if-no-files-found: error
