name: Nightly build

# Builds all three platforms on every push to main, and can be triggered
# manually from any branch (gh workflow run nightly.yml --ref <branch>) to
# test platform builds without local cross-compilation.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Nightly (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            # macos-26: needs the Xcode 26 SDK so the Apple Speech engine's
            # Swift bridge is real, not stubbed (enforced by build.rs)
            os: macos-26
            bundles: app
          - name: windows
            os: windows-latest
            bundles: nsis
          - name: linux
            os: ubuntu-latest
            bundles: deb rpm appimage
    runs-on: ${{ matrix.os }}
    # release build + bundling + the engine smoke test (a debug build of
    # the test crate) on a cold cache; still well below the 6h default
    timeout-minutes: 120
    env:
      REQUIRE_MACOS26_SDK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm version: the packageManager field in package.json (a
      # `version:` input here too makes the action fail on mismatch)
      - id: pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # pnpm 12 on Windows: pnpm/action-setup installs pnpm with a local
      # (non-global) npm install, so npm's pnpm.ps1/pnpm.cmd shims still
      # call the native binary by its extensionless name. PowerShell and
      # cmd hand an extensionless file to the shell to "open" instead of
      # running it - exit 0, no output - so `pnpm tauri build` silently
      # built nothing. A folder holding only pnpm.exe, first on PATH, makes
      # every shell (including cmd for Tauri's beforeBuildCommand) run it.
      - name: Put pnpm.exe first on PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = Join-Path $env:RUNNER_TEMP "pnpm-exe"
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          Copy-Item (Join-Path "${{ steps.pnpm.outputs.dest }}" "node_modules/pnpm/pnpm.exe") $bin
          Add-Content -Path $env:GITHUB_PATH -Value $bin

      - name: Check pnpm really runs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $want = (Get-Content package.json -Raw | ConvertFrom-Json).packageManager -replace '^pnpm@', ''
          $ps = "$(pnpm --version)".Trim()
          $cmd = "$(cmd /c pnpm --version)".Trim()
          Write-Output "pnpm --version: pwsh '$ps', cmd '$cmd' (want '$want')"
          if ($ps -ne $want -or $cmd -ne $want) { throw "pnpm does not run as $want" }

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch (this action publishes no version tags)
        with:
          # same exact version as rust-toolchain.toml (which rustup honours
          # for every cargo call below); keep the two in sync
          toolchain: "1.98.1"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev cmake

      - name: Stamp nightly version
        shell: bash
        run: |
          BASE="$(node -e "console.log(JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json','utf8')).version)")"
          # '+' not '-': must stay valid semver (tauri parses it; a purely
          # numeric short SHA with a leading zero once broke the build, hence
          # the 'sha' prefix) and the AppImage bundler rejects versions with
          # '-' (allowed: alphanumeric, '.', '_', '+', '%', '{', '}', '~', '^')
          NIGHTLY="${BASE}+nightly.sha${GITHUB_SHA::7}"
          echo "stamping nightly version $NIGHTLY"
          VERSION="$NIGHTLY" node -e "
            const fs = require('fs');
            const p = 'src-tauri/tauri.conf.json';
            const j = JSON.parse(fs.readFileSync(p, 'utf8'));
            j.version = process.env.VERSION;
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
          "

      # Nightly artifacts are never published to the update feed, so they
      # are not signed at all: src-tauri/tauri.nightly.conf.json turns off
      # updater artifacts. A file, not inline JSON, because pwsh (the
      # Windows default shell) can strip the quotes from a JSON argument.
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: pnpm tauri build --bundles app --config src-tauri/tauri.nightly.conf.json

      - name: Package DMG (macOS)
        if: runner.os == 'macOS'
        run: bash scripts/make-dmg.sh

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: pnpm tauri build --bundles nsis --config src-tauri/tauri.nightly.conf.json

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: pnpm tauri build --bundles ${{ matrix.bundles }} --config src-tauri/tauri.nightly.conf.json

      # The engine smoke test is the only guard that whisper.cpp and
      # llama.cpp actually RUN together in one process (the duplicate
      # ggml symbol tolerance). It needs real model files, so it runs
      # here with tiny ones, cached across runs.
      - name: Restore tiny test models
        id: engine-models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/engine-models
          key: engine-models-tiny-v1

      - name: Download tiny test models
        if: steps.engine-models.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/engine-models"
          curl -fL --retry 3 -o "${RUNNER_TEMP}/engine-models/whisper-tiny.en.bin" \
            "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin"
          # stories260K: a ~1MB llama used by upstream llama.cpp tests
          curl -fL --retry 3 -o "${RUNNER_TEMP}/engine-models/tiny.gguf" \
            "https://huggingface.co/ggml-org/models/resolve/main/tinyllamas/stories260K.gguf"

      - name: Engine smoke test (whisper + llama coexist)
        shell: bash
        working-directory: src-tauri
        env:
          WHISPER_MODEL_PATH: ${{ runner.temp }}/engine-models/whisper-tiny.en.bin
          LLM_MODEL_PATH: ${{ runner.temp }}/engine-models/tiny.gguf
        run: cargo test --test engine_smoke --locked

      # The speech pipeline test runs VAD, RNNoise and Parakeet (ONNX
      # Runtime, statically linked) on real speech - the only check that
      # ONNX Runtime links and runs on every platform we ship. The ~670 MB
      # model is cached; the key carries the pinned encoder sha256 (see
      # src-tauri/src/models/catalog.rs), so a catalog bump refetches it.
      - name: Restore Parakeet test model
        id: parakeet-model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/parakeet-tdt-0.6b-v3
          key: parakeet-tdt-0.6b-v3-int8-6139d2fa7e1b

      - name: Download Parakeet test model
        if: steps.parakeet-model.outputs.cache-hit != 'true'
        shell: bash
        run: |
          dir="${RUNNER_TEMP}/parakeet-tdt-0.6b-v3"
          mkdir -p "$dir"
          base="https://huggingface.co/istupakov/parakeet-tdt-0.6b-v3-onnx/resolve/main"
          # the same pins as the app's catalog: a changed upstream file
          # fails here instead of being cached
          while read -r sha file; do
            curl -fL --retry 3 -o "$dir/$file" "$base/$file"
            # hash stdin: with a path argument, GNU sha256sum prefixes the
            # line with "\" when the path has a backslash (RUNNER_TEMP on
            # Windows), and the comparison below fails on a correct file
            if command -v sha256sum >/dev/null; then
              got=$(sha256sum < "$dir/$file" | cut -d' ' -f1)
            else
              got=$(shasum -a 256 < "$dir/$file" | cut -d' ' -f1)
            fi
            if [ "$got" != "$sha" ]; then
              echo "::error::$file sha256 $got does not match the pin $sha"
              rm -rf "$dir"
              exit 1
            fi
          done <<'PINS'
          6139d2fa7e1b086097b277c7149725edbab89cc7c7ae64b23c741be4055aff09 encoder-model.int8.onnx
          eea7483ee3d1a30375daedc8ed83e3960c91b098812127a0d99d1c8977667a70 decoder_joint-model.int8.onnx
          a9fde1486ebfcc08f328d75ad4610c67835fea58c73ba57e3209a6f6cf019e9f nemo128.onnx
          d58544679ea4bc6ac563d1f545eb7d474bd6cfa467f0a6e2c1dc1c7d37e3c35d vocab.txt
          PINS

      # Test speech from each OS's own speech synthesizer (no audio file
      # in the repo): espeak-ng on Linux, `say` on macOS, SAPI on Windows.
      - name: Synthesize test speech (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y espeak-ng
          espeak-ng -v en-us -s 150 -w "${RUNNER_TEMP}/speech.wav" \
            "The quick brown fox jumps over the lazy dog."

      - name: Synthesize test speech (macOS)
        if: runner.os == 'macOS'
        run: |
          say --file-format=WAVE --data-format=LEI16@22050 -o "${RUNNER_TEMP}/speech.wav" \
            "The quick brown fox jumps over the lazy dog."

      - name: Synthesize test speech (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Speech
          $voice = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $voice.SetOutputToWaveFile("$env:RUNNER_TEMP\speech.wav")
          $voice.Speak("The quick brown fox jumps over the lazy dog.")
          $voice.Dispose()

      - name: Speech pipeline test (VAD, RNNoise, Parakeet)
        shell: bash
        working-directory: src-tauri
        env:
          PARAKEET_MODEL_DIR: ${{ runner.temp }}/parakeet-tdt-0.6b-v3
          SPEECH_WAV: ${{ runner.temp }}/speech.wav
        run: cargo test --test speech_pipeline --locked -- --nocapture

      - name: Upload artifacts (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-macos
          path: src-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 7
          if-no-files-found: error

      - name: Upload artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 7
          if-no-files-found: error

      - name: Upload artifacts (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 7
          if-no-files-found: error
