name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-latest
            bundles: app
          - name: windows
            os: windows-latest
            bundles: nsis
          - name: linux
            os: ubuntu-latest
            bundles: deb rpm appimage
    runs-on: ${{ matrix.os }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev cmake

      - name: Set version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "setting app version to $VERSION"
          VERSION="$VERSION" node -e "
            const fs = require('fs');
            const p = 'src-tauri/tauri.conf.json';
            const j = JSON.parse(fs.readFileSync(p, 'utf8'));
            j.version = process.env.VERSION;
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
          "

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: pnpm tauri build --bundles app

      # tauri's own dmg bundler needs Finder/AppleScript; use the repo's
      # headless hdiutil packaging instead
      - name: Package DMG (macOS)
        if: runner.os == 'macOS'
        run: bash scripts/make-dmg.sh

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: pnpm tauri build --bundles nsis

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: pnpm tauri build --bundles deb rpm appimage

      - name: Upload updater artifacts (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: updater-macos
          path: |
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

      - name: Upload installer (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: packages-macos
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Upload updater artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: updater-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error

      - name: Upload updater artifacts (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: updater-linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
          if-no-files-found: error

      - name: Upload packages (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: packages-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

  release:
    name: Publish GitHub release + updater feed
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download built packages
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate updater feed (latest.json)
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BASE="https://github.com/brainstory/desktop-app/releases/download/${GITHUB_REF_NAME}"

          MAC_TAR_NAME="$(basename artifacts/*.app.tar.gz)"
          MAC_SIG="$(cat "artifacts/${MAC_TAR_NAME}.sig")"

          WIN_EXE_NAME="$(basename artifacts/*setup.exe)"
          WIN_SIG="$(cat "artifacts/${WIN_EXE_NAME}.sig")"

          LINUX_IMG_NAME="$(basename artifacts/*.AppImage)"
          LINUX_SIG="$(cat "artifacts/${LINUX_IMG_NAME}.sig")"

          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          node -e '
            const fs = require("fs");
            const [version, baseUrl, macTar, macSig, winExe, winSig, linuxImg, linuxSig, pubDate] = process.argv.slice(1);
            const feed = {
              version,
              pub_date: pubDate,
              platforms: {
                "darwin-aarch64": { signature: macSig, url: `${baseUrl}/${macTar}` },
                "windows-x86_64": { signature: winSig, url: `${baseUrl}/${winExe}` },
                "linux-x86_64":   { signature: linuxSig, url: `${baseUrl}/${linuxImg}` },
              }
            };
            fs.writeFileSync("artifacts/latest.json", JSON.stringify(feed, null, 2) + "\n");
          ' "$VERSION" "$BASE" "$MAC_TAR_NAME" "$MAC_SIG" "$WIN_EXE_NAME" "$WIN_SIG" "$LINUX_IMG_NAME" "$LINUX_SIG" "$PUB_DATE"

          echo "--- latest.json ---"
          cat artifacts/latest.json

      - name: Attach packages + updater feed to release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: artifacts/*
