name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# one release pipeline per tag; never cancel an in-flight release midway.
# Must never equal the group ci.yml takes when called from here (see
# ci.yml; "release-<ref>" matched its "Release-<ref>" case-insensitively).
concurrency:
  group: release-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Checks
    # a bad tag must fail the checks, not ship to every installed client
    # (the updater points at releases/latest/download/latest.json)
    uses: ./.github/workflows/ci.yml
    # a called workflow can only narrow the caller's token: ci.yml's
    # audit job needs these, so the call must grant them
    permissions:
      contents: read
      checks: write
      issues: write

  build:
    name: Build (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            # macos-26: needs the Xcode 26 SDK so the Apple Speech engine's
            # Swift bridge is real, not stubbed (enforced by build.rs)
            os: macos-26
            bundles: app
          - name: windows
            os: windows-latest
            bundles: nsis
          - name: linux
            os: ubuntu-latest
            bundles: deb rpm appimage
    runs-on: ${{ matrix.os }}
    # cold-cache llama.cpp + whisper.cpp release builds run long; still
    # cap a hung bundler or runner well below the 6h default
    timeout-minutes: 90
    env:
      REQUIRE_MACOS26_SDK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm version: the packageManager field in package.json (a
      # `version:` input here too makes the action fail on mismatch)
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch (this action publishes no version tags)
        with:
          # same exact version as rust-toolchain.toml (which rustup honours
          # for every cargo call below); keep the two in sync
          toolchain: "1.98.1"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev cmake

      - name: Verify tag matches committed version
        # Releases no longer rewrite the version from the tag: the
        # versions must be committed (scripts/bump-version.mjs) and the
        # tag must agree with all of them.
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          check() {
            if [ "$2" != "$VERSION" ]; then
              echo "::error::$1 is $2 but the tag says $VERSION - run: node scripts/bump-version.mjs $VERSION"
              exit 1
            fi
          }
          check tauri.conf.json "$(node -p "require('./src-tauri/tauri.conf.json').version")"
          check Cargo.toml "$(sed -n 's/^version *= *"\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)"
          check package.json "$(node -p "require('./package.json').version")"
          check app/frontend/package.json "$(node -p "require('./app/frontend/package.json').version")"

      # The updater signing key is scoped to the build steps ONLY: a
      # job-level env would expose the production key to every step
      # (checkout, pnpm postinstall scripts, crate build.rs, apt-get).
      - name: Build (macOS)
        if: runner.os == 'macOS'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles app

      # tauri's own dmg bundler needs Finder/AppleScript; use the repo's
      # headless hdiutil packaging instead
      - name: Package DMG (macOS)
        if: runner.os == 'macOS'
        run: bash scripts/make-dmg.sh

      - name: Build (Windows)
        if: runner.os == 'Windows'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles nsis

      - name: Build (Linux)
        if: runner.os == 'Linux'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles deb rpm appimage

      - name: Upload updater artifacts (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: updater-macos
          path: |
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

      - name: Upload installer (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-macos
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Upload updater artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: updater-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error

      - name: Upload updater artifacts (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: updater-linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
          if-no-files-found: error

      - name: Upload packages (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

  release:
    name: Publish GitHub release + updater feed
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # write access only where it is needed: this job
      contents: write
      # build provenance attestations (subject-path below)
      id-token: write
      attestations: write
    steps:
      - name: Download built packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate updater feed (latest.json)
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BASE="https://github.com/brainstory/desktop-app/releases/download/${GITHUB_REF_NAME}"

          MAC_TAR_NAME="$(basename artifacts/*.app.tar.gz)"
          MAC_SIG="$(cat "artifacts/${MAC_TAR_NAME}.sig")"

          WIN_EXE_NAME="$(basename artifacts/*setup.exe)"
          WIN_SIG="$(cat "artifacts/${WIN_EXE_NAME}.sig")"

          LINUX_IMG_NAME="$(basename artifacts/*.AppImage)"
          LINUX_SIG="$(cat "artifacts/${LINUX_IMG_NAME}.sig")"

          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          node -e '
            const fs = require("fs");
            const [version, baseUrl, macTar, macSig, winExe, winSig, linuxImg, linuxSig, pubDate] = process.argv.slice(1);
            const feed = {
              version,
              pub_date: pubDate,
              platforms: {
                "darwin-aarch64": { signature: macSig, url: `${baseUrl}/${macTar}` },
                "windows-x86_64": { signature: winSig, url: `${baseUrl}/${winExe}` },
                "linux-x86_64":   { signature: linuxSig, url: `${baseUrl}/${linuxImg}` },
              }
            };
            fs.writeFileSync("artifacts/latest.json", JSON.stringify(feed, null, 2) + "\n");
          ' "$VERSION" "$BASE" "$MAC_TAR_NAME" "$MAC_SIG" "$WIN_EXE_NAME" "$WIN_SIG" "$LINUX_IMG_NAME" "$LINUX_SIG" "$PUB_DATE"

          echo "--- latest.json ---"
          cat artifacts/latest.json

      # Draft: a human flips the release live. Until then the updater
      # feed (releases/latest/download/latest.json) still serves the
      # previous version - one bad tag can no longer auto-ship.
      - name: Generate checksums (SHA256SUMS.txt)
        shell: bash
        run: |
          sha256sum artifacts/* > artifacts/SHA256SUMS.txt
          cat artifacts/SHA256SUMS.txt

      # verifiable link from the artifacts back to this workflow run
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/*

      - name: Attach packages + updater feed to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: artifacts/*
