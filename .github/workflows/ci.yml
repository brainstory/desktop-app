name: CI

on:
  push:
    branches: [main]
  pull_request:
  # called by release.yml so a tag can never ship without the checks
  workflow_call:
  # weekly sweep catches advisories published after the last commit
  schedule:
    - cron: "0 6 * * 1"

# When release.yml calls this file, github.workflow is the caller's name
# ("Release"), so a plain workflow-ref group collided with release.yml's
# own group (group names compare case-insensitively) and GitHub cancelled
# the call as a deadlock. The ci- prefix keeps them apart; event_name
# keeps the weekly schedule and a push to main from cancelling each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm version: the packageManager field in package.json (a
      # `version:` input here too makes the action fail on mismatch)
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (tsc + astro check)
        run: pnpm typecheck

      - name: Lint (zero warnings allowed)
        run: pnpm lint --max-warnings 0

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test:coverage

      # build scripts (scripts/*.test.mjs) run under plain node:test
      - name: Test build scripts
        run: node --test scripts/

      - name: Build
        run: pnpm build

      # after Build (which vendors): public/vendor must be complete and
      # every ionicon name in the source must have an SVG
      - name: Vendored assets + icon names
        run: pnpm vendor:check

  rust:
    name: Rust ${{ matrix.name }} (fmt, clippy, tests)
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-26: Xcode 26 SDK keeps the Apple Speech engine real
          # instead of stubbed; REQUIRE_MACOS26_SDK makes a wrong image
          # fail loudly
          - name: macOS
            os: macos-26
            require_macos26_sdk: "1"
          - name: Linux
            os: ubuntu-latest
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    env:
      REQUIRE_MACOS26_SDK: ${{ matrix.require_macos26_sdk }}
    defaults:
      run:
        working-directory: src-tauri
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          # GitHub-hosted Ubuntu runners have transient DNS outages that can
          # leave apt-get retrying "Temporary failure resolving" for 45+
          # minutes. Fail fast (short acquire timeouts, outer timeout) and
          # retry with backoff: bounded, and it recovers as soon as DNS
          # comes back instead of hanging the job.
          for attempt in 1 2 3 4 5 6; do
            if timeout 240 bash -c 'sudo apt-get -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10 -o Acquire::Retries=1 update
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2 install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev cmake'; then
              break
            fi
            if [ "$attempt" = 6 ]; then
              echo "::error::apt-get failed after 6 attempts (runner DNS/network outage)"
              exit 1
            fi
            echo "apt-get attempt $attempt failed; retrying in $((attempt * 20))s" >&2
            sleep $((attempt * 20))
          done

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch (this action publishes no version tags)
        with:
          # same exact version as rust-toolchain.toml (which rustup honours
          # for every cargo call below); keep the two in sync
          toolchain: "1.98.1"
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      # cargo-llvm-cov (Linux leg only): measures line coverage of the
      # unit tests instead of merely running them
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.89.0 (installs cargo-llvm-cov v0.9.1)
        if: runner.os == 'Linux'
        with:
          tool: cargo-llvm-cov

      - name: Format
        run: cargo fmt --check

      # --all-targets also compile-checks the env-gated integration tests
      # (engine_smoke, model_prompts, special_tokens, speech_pipeline,
      # apple_stt_smoke) and examples without needing model files
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # Unit tests only: engine_smoke and the speech pipeline run in the
      # nightly workflow with real (tiny) fixtures; special_tokens,
      # model_prompts and apple_stt_smoke need gemma/qwen-family or
      # macOS-only models and stay manual (see README)
      - name: Tests
        if: runner.os != 'Linux'
        run: cargo test --lib --locked

      # The Linux leg runs the same unit tests under cargo-llvm-cov and
      # fails under a floor on covered lines. First green run measured
      # 72.06% lines (2026-11-02); the floor stays at 70 - above the
      # measured-minus-3 target - so small drops warn without
      # penalising normal churn.
      - name: Tests (coverage)
        if: runner.os == 'Linux'
        run: cargo llvm-cov --lib --locked --summary-only --fail-under-lines 70

      # the ts-rs export tests just regenerated src/tauri/generated; a
      # diff means the committed TypeScript types no longer match the
      # Rust definitions - run `pnpm types:generate` and commit
      - name: Generated IPC types match the Rust structs
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: |
          git diff --exit-code -- ../src/tauri/generated || {
            echo "::error::src/tauri/generated is stale - run 'pnpm types:generate' and commit the result"
            exit 1
          }

  audit:
    name: Dependency audit (cargo + pnpm)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # audit-check reports through a check run on push/PR...
      checks: write
      # ...and opens an issue per advisory on the weekly schedule
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned to a main commit, not a release: v2.0.0 (the latest release)
      # runs on the deprecated Node 20, and the Node 24 switch (#48) is
      # unreleased. v2.0.0...858dc40 changes only docs and the runtime.
      # Switch back to a release tag once one ships with Node 24.
      - name: cargo audit (RustSec advisories)
        uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432 # main (Node 24, after v2.0.0)
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Cargo.lock lives in src-tauri/, not the repo root
          working-directory: src-tauri

      # pnpm version: the packageManager field in package.json (a
      # `version:` input here too makes the action fail on mismatch)
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: pnpm audit (production dependencies, high and above)
        run: pnpm audit --prod --audit-level=high
