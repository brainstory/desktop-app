name: CI

on:
  push:
    branches: [main]
  pull_request:
  # called by release.yml so a tag can never ship without the checks
  workflow_call:
  # weekly sweep catches advisories published after the last commit
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (tsc + astro check)
        run: pnpm -C app/frontend typecheck

      - name: Lint (zero warnings allowed)
        run: pnpm -C app/frontend lint --max-warnings 0

      - name: Format check
        run: pnpm -C app/frontend format:check

      - name: Test
        run: pnpm -C app/frontend test

      - name: Build
        run: pnpm -C app/frontend build

  rust:
    name: Rust ${{ matrix.name }} (fmt, clippy, tests)
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-26: Xcode 26 SDK keeps the Apple Speech engine real
          # instead of stubbed; REQUIRE_MACOS26_SDK makes a wrong image
          # fail loudly
          - name: macOS
            os: macos-26
            require_macos26_sdk: "1"
          - name: Linux
            os: ubuntu-latest
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    env:
      REQUIRE_MACOS26_SDK: ${{ matrix.require_macos26_sdk }}
    defaults:
      run:
        working-directory: src-tauri
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev cmake

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Format
        run: cargo fmt --check

      # --all-targets also compile-checks the env-gated integration tests
      # (engine_smoke, model_prompts) and examples without needing model files
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # Unit tests only: engine_smoke / model_prompts require real model
      # files via env vars and are run manually (see README)
      - name: Tests
        run: cargo test --lib --locked

  audit:
    name: Dependency audit (cargo + pnpm)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: cargo audit (RustSec advisories)
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: pnpm

      - name: pnpm audit (production dependencies, high and above)
        run: pnpm audit --prod --audit-level=high
