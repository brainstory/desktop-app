version: 2
updates:
  # All GitHub Actions bumps in one weekly PR
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  # Rust crates (llama-cpp-2 / whisper-rs are exact-pinned; Dependabot will
  # still PR when newer versions land, which is the desired nudge)
  - package-ecosystem: cargo
    directory: /src-tauri
    # ort release candidates break API even within the same 2.0 version.
    # Upgrade only together with a compatible transcribe-rs release.
    ignore:
      - dependency-name: ort
      - dependency-name: ort-sys
    schedule:
      interval: weekly
    groups:
      cargo-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # npm deps (Astro/React frontend + @tauri-apps/cli at the root)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
