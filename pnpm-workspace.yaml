# pnpm reads project settings from this file even when (as here) the
# project is a single package: with no `packages` field, only the root
# package is included.
#
# esbuild and sharp ship postinstall scripts that pnpm blocks by default
allowBuilds:
  esbuild: true
  sharp: true

# @napi-rs/wasm-runtime offers "^1.7.1 || 2.0.0-beta.2"; pnpm picks the
# literal beta, whose runtime lacks setLastError, while @emnapi/core is
# still 1.x - astro check then crashes at startup. Keep the WASM helper
# on the stable 1.x line until both halves upgrade together.
auditConfig:
  ignoreGhsas:
    - GHSA-fc5q-39xc-vjpf

overrides:
  "@emnapi/runtime": 1.11.3
